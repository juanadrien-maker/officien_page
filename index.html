<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Votre Vidéo Personnalisée</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0731ec 0%, #090135 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 95vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .video-container {
            position: relative;
            width: 90%;
            max-width: 1200px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        /* Style pour l'iframe Vimeo */
        iframe { 
            width: 100%; 
            height: 675px;
            display: block;
            border: none;
        }
        
        /* Conteneur du bouton positionné en bas à droite */
        .cta-overlay {
            position: absolute;
            bottom: 210px;
            right: 7px;
            z-index: 10;
        }
        
        /* Wrapper pour la bordure animée */
        .button-wrapper {
            position: relative;
            display: inline-block;
            padding: 4px;
            border-radius: 50px;
            background: linear-gradient(90deg, #a2a2ab, #090573, #ca18ac, #170de0);
            background-size: 300% 300%;
            animation: borderGradient 12s linear infinite;
        }
        
        .cta-button {
            display: inline-block;
            background: linear-gradient(90deg, #010232, #090573, #0e04d0, #170de0);
            color: white;
            padding: 18px 40px;
            text-decoration: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 8px 25px rgba(118,75,162,0.5);
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }
        
        .cta-button:hover {
            background: #5a3680;
            transform: scale(1.05);
            box-shadow: 0 12px 35px rgba(118,75,162,0.7);
        }
        
        /* Animation de la bordure qui tourne */
        @keyframes borderGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* Bouton caché au départ */
        .hidden-button {
            opacity: 0;
            transform: translateX(-400px);
            transition: none;
        }
        
        /* Animation de glissement */
        .slide-in {
            animation: slideFromLeft 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }
        
        @keyframes slideFromLeft {
            0% {
                opacity: 0;
                transform: translateX(-400px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        /* Message de chargement */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            text-align: center;
        }
        
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            iframe {
                height: 400px;
            }
            .cta-overlay { 
                bottom: 20px; 
                right: 10px; 
            }
            .cta-button { 
                padding: 14px 30px; 
                font-size: 16px; 
            }
        }
    </style>
</head>
<body>
    <div class="video-container">
        <!-- Message de chargement -->
        <div class="loading" id="loadingMessage">
            <div class="spinner"></div>
            <p>Chargement de votre vidéo...</p>
        </div>
        
        <!-- Iframe Vimeo -->
        <iframe id="vimeoPlayer" allow="autoplay; fullscreen; picture-in-picture" style="display: none;"></iframe>
        
        <div class="cta-overlay">
            <div class="button-wrapper hidden-button" id="buttonWrapper">
                <a href="https://officein.fr" target="_blank" class="cta-button">
                    🌐 Voir le Demo
                </a>
            </div>
        </div>
    </div>

    <!-- SDK Vimeo Player -->
    <script src="https://player.vimeo.com/api/player.js"></script>
    
    <script>
        // Récupérer l'ID de la vidéo depuis les paramètres URL
        const urlParams = new URLSearchParams(window.location.search);
        const videoParam = urlParams.get('video');
        
        const playerIframe = document.getElementById('vimeoPlayer');
        const loadingMessage = document.getElementById('loadingMessage');
        const buttonWrapper = document.getElementById('buttonWrapper');
        
        if (videoParam) {
            // Extraire l'ID Vimeo (supporter à la fois l'ID seul et l'URL complète)
            let videoId;
            if (videoParam.includes('vimeo.com/')) {
                videoId = videoParam.split('vimeo.com/')[1].split('?')[0];
            } else {
                videoId = videoParam;
            }
            
            // Construire l'URL du player Vimeo
            playerIframe.src = `https://player.vimeo.com/video/${videoId}?autoplay=1&muted=1&loop=1`;
            
            // Initialiser le player Vimeo
            const player = new Vimeo.Player(playerIframe);
            
            // Quand le player est prêt
            player.ready().then(function() {
                loadingMessage.style.display = 'none';
                playerIframe.style.display = 'block';
            });
            
            // Écouter le temps de lecture
            player.on('timeupdate', function(data) {
                // Afficher le bouton après 87 secondes
                if (data.seconds >= 87 && buttonWrapper.classList.contains('hidden-button')) {
                    buttonWrapper.classList.remove('hidden-button');
                    buttonWrapper.classList.add('slide-in');
                }
            });
            
        } else {
            // Si pas de paramètre vidéo
            loadingMessage.innerHTML = '<p>❌ Aucune vidéo spécifiée</p>';
        }
    </script>
</body>
</html>
