<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Présentation en video</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0731ec 0%, #090135 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 95vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .video-container {
            position: relative;
            width: 90%;
            max-width: 1200px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        iframe { 
            width: 100%; 
            height: 675px;
            display: block;
            border: none;
        }
        
        /* Conteneur CTA - repositionné plus centré */
        .cta-overlay {
            position: absolute;
  bottom: 35%;
  
  left: 80%;
  
  z-index: 10;
        }
        
        /* Container pour le bouton et le curseur */
        .cta-container {
            position: relative;
            display: inline-block;
        }
        
        /* Curseur animé */
        .cursor-pointer {
            position: absolute;
            top: -60px;
            right: -60px;
            width: 40px;
            height: 40px;
            pointer-events: none;
            opacity: 0;
            animation: cursorFloat 2s ease-in-out infinite, cursorFade 0.6s ease-in-out 0.5s forwards;
        }
        
        .cursor-pointer svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }
        
        @keyframes cursorFloat {
            0%, 100% { 
                transform: translate(0, 0) rotate(-20deg); 
            }
            50% { 
                transform: translate(-10px, -10px) rotate(-20deg); 
            }
        }
        
        @keyframes cursorFade {
            to { opacity: 1; }
        }
        
        /* Animation de clic du curseur */
        @keyframes cursorClick {
            0%, 100% { transform: translate(0, 0) rotate(-20deg) scale(1); }
            50% { transform: translate(0, 0) rotate(-20deg) scale(0.9); }
        }
        
        .cursor-pointer.clicking {
            animation: cursorClick 0.3s ease-in-out infinite;
        }
        
        /* Bouton moderne style YouTube */
        .cta-button {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: #ff0000;
            color: white;
            padding: 16px 32px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            box-shadow: 0 4px 20px rgba(255, 0, 0, 0.4);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        /* Effet de brillance sur le bouton */
        .cta-button::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(255, 255, 255, 0.3) 50%,
                transparent 70%
            );
            transform: rotate(45deg);
            animation: shine 3s ease-in-out infinite;
        }
        
        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }
        
        .cta-button:hover {
            background: #cc0000;
            transform: scale(1.05);
            box-shadow: 0 6px 30px rgba(255, 0, 0, 0.6);
        }
        
        .cta-button:active {
            transform: scale(0.98);
        }
        
        /* Icône dans le bouton */
        .button-icon {
            font-size: 24px;
            animation: bounce 2s ease-in-out infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        
        /* Effet de pulsation autour du bouton */
        .pulse-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            border: 3px solid #ff0000;
            border-radius: 8px;
            animation: pulse 2s ease-out infinite;
            opacity: 0;
        }
        
        @keyframes pulse {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.3);
                opacity: 0;
            }
        }
        
        /* Badge "NOUVEAU" ou "GRATUIT" */
        .badge {
            position: absolute;
            top: -12px;
            right: -12px;
            background: #00ff00;
            color: #000;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0, 255, 0, 0.5);
            animation: badgePulse 1.5s ease-in-out infinite;
            z-index: 1;
        }
        
        @keyframes badgePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        /* État caché */
        .hidden-button {
            opacity: 0;
            transform: translateY(50px) scale(0.8);
            transition: none;
        }
        
        /* Animation d'apparition */
        .slide-in {
            animation: slideIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        
        @keyframes slideIn {
            0% {
                opacity: 0;
                transform: translateY(50px) scale(0.8);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        /* Message de chargement */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            text-align: center;
        }
        
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            iframe {
                height: 400px;
            }
            .cta-overlay { 
                bottom: 15%;
            }
            .cta-button { 
                padding: 14px 24px; 
                font-size: 16px; 
            }
            .cursor-pointer {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="video-container">
        <div class="loading" id="loadingMessage">
            <div class="spinner"></div>
            <p>Chargement de votre vidéo...</p>
        </div>
        
        <iframe id="vimeoPlayer" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen style="display: none;"></iframe>
        
        <div class="cta-overlay">
            <div class="cta-container hidden-button" id="buttonWrapper">
                
                <!-- Anneaux de pulsation -->
                <div class="pulse-ring"></div>
                <div class="pulse-ring" style="animation-delay: 1s;"></div>
                
                <!-- Badge -->
                <span class="badge">Demander une Démo</span>
                
                <!-- Bouton CTA -->
                <a href="https://officein.fr/inscription" target="_blank" class="cta-button" id="ctaButton">
                    <span class="button-icon">🎯</span>
                    <span>officein.fr</span>
                </a>
            </div>
        </div>
    </div>

    <script src="https://player.vimeo.com/api/player.js"></script>
    
    <script>
    const urlParams = new URLSearchParams(window.location.search);
    const videoParam = urlParams.get('video');
    
    const playerIframe = document.getElementById('vimeoPlayer');
    const loadingMessage = document.getElementById('loadingMessage');
    const buttonWrapper = document.getElementById('buttonWrapper');
    
    const ctaButton = document.getElementById('ctaButton');
    
    if (videoParam) {
        let videoId;
        if (videoParam.includes('vimeo.com/')) {
            videoId = videoParam.split('vimeo.com/')[1].split('?')[0].split('/')[0];
        } else {
            videoId = videoParam;
        }
        
        // Démarre en mute pour permettre l'autoplay
        const embedUrl = `https://player.vimeo.com/video/${videoId}?autoplay=1&muted=1&loop=1&title=0&byline=0&portrait=0`;
        playerIframe.src = embedUrl;
        
        playerIframe.onload = function() {
            try {
                const player = new Vimeo.Player(playerIframe);
                
                player.ready().then(function() {
                    loadingMessage.style.display = 'none';
                    playerIframe.style.display = 'block';
                    
                    // Essaie d'activer le son automatiquement après un court délai
                    setTimeout(function() {
                        player.setMuted(false).then(function() {
                            player.setVolume(1);
                            console.log('Son activé avec succès');
                        }).catch(function(error) {
                            console.log('Le navigateur bloque le son:', error);
                            // Si ça échoue, affiche un bouton pour activer le son
                            afficherBoutonSon(player);
                        });
                    }, 500);
                    
                }).catch(function(error) {
                    console.error('Erreur ready:', error);
                    loadingMessage.innerHTML = '<p>❌ Erreur de chargement de la vidéo</p>';
                });
                
                player.on('timeupdate', function(data) {
                    if (data.seconds >= 87 && buttonWrapper.classList.contains('hidden-button')) {
                        buttonWrapper.classList.remove('hidden-button');
                        buttonWrapper.classList.add('slide-in');
                    }
                });
                
                player.on('error', function(error) {
                    console.error('Erreur player:', error);
                    loadingMessage.innerHTML = '<p>❌ Impossible de lire la vidéo</p>';
                    loadingMessage.style.display = 'block';
                });
                
            } catch (error) {
                console.error('Erreur initialisation:', error);
                loadingMessage.innerHTML = '<p>❌ Erreur d\'initialisation</p>';
            }
        };
        
    } else {
        loadingMessage.innerHTML = '<p>❌ Aucune vidéo spécifiée</p>';
    }
    
    // Fonction pour afficher un bouton "Activer le son"
    function afficherBoutonSon(player) {
        const soundButton = document.createElement('button');
        soundButton.innerHTML = '🔊 Activer le son';
        soundButton.style.cssText = `
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            padding: 12px 24px;
            background: #00adef;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        `;
        
        soundButton.onmouseover = function() {
            this.style.background = '#0088cc';
            this.style.transform = 'scale(1.05)';
        };
        
        soundButton.onmouseout = function() {
            this.style.background = '#00adef';
            this.style.transform = 'scale(1)';
        };
        
        document.body.appendChild(soundButton);
        
        soundButton.onclick = function() {
            player.setMuted(false);
            player.setVolume(1);
            soundButton.style.opacity = '0';
            setTimeout(function() {
                soundButton.remove();
            }, 300);
        };
    }
</script>
    <script>
// ---------------------------
// ---------------------------
// 1. Récupération User ID
// ---------------------------
const params = new URLSearchParams(window.location.search);
 
const userId = params.get('video');  // ⚠️ CORRECTION: c'était "urlParams" au lieu de "params"
const nomUser = params.get('nom');       

if (!userId) {
    console.warn("Aucun user ID dans l'URL → tracking impossible");
}

// ---------------------------
// 2. Système de détection 1ère visite
// LocalStorage → évite double comptage
// ---------------------------
const localKey = "video_opened_" + userId;
let isFirstOpen = false;

if (!localStorage.getItem(localKey)) {
    isFirstOpen = true;
    localStorage.setItem(localKey, "true");
}

// ---------------------------
// 3. Récupération de l'IP
// ---------------------------
async function getUserIP() {
    try {
        const response = await fetch('https://api.ipify.org?format=json');
        const data = await response.json();
        return data.ip;
    } catch (error) {
        console.error("Erreur récupération IP:", error);
        return "IP non disponible";
    }
}

// ---------------------------
// 4. Envoi webhook vers Make
// ---------------------------
function nowFR() {
    const d = new Date();
    return d.toLocaleString("fr-FR", {
        timeZone: "Europe/Paris"
    });
}

async function sendToMake() {
    // Récupérer l'IP avant d'envoyer
    const userIP = await getUserIP();
    
    fetch("https://hook.eu2.make.com/po87vh7wqceje7sc6ctc6lvyg8onuio8", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            user_id: userId,
            nom: nomUser,
            first_open: isFirstOpen,
            page_url: window.location.href,
            timestamp: nowFR(),
            ip_address: userIP,  // ✅ IP ajoutée
            userAgent: navigator.userAgent,
            language: navigator.language  
        })
    })
    .then(res => console.log("Webhook Make OK:", res.status))
    .catch(err => console.error("Erreur Webhook:", err));
}

// Appeler seulement si userId est correct
if (userId) {
    sendToMake();
}
</script>

</body>
</html>
